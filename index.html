<!<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My GIF Collection</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial, sans-serif;
}

header{
    text-align:center;
    padding:25px;
    font-size:32px;
    font-weight:bold;
    background:#151515;
    border-bottom:2px solid #222;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:#1b1b1b;
    border-radius:18px;
    overflow:hidden;
    transition:0.2s;
}

.card:hover{
    transform:scale(1.03);
}

.card img{
    width:100%;
    display:block;
}

.title{
    padding:12px;
    font-size:18px;
}
</style>
</head>
<body>

<header>
AHMETOKUMUS GIF ARCHIVE
</header>

<div class="gallery">

<div class="card">
<img src="gifs/destanmi.gif">
<div class="title">DESTANMI YAZIYON REIS</div>
</div>

<div class="card">
<img src="gifs/haramball.gif">
<div class="title">Simeone Haramball Today</div>
</div>

<div class="card">
<img src="gifs/cat.gif">
<div class="title">Sad Cat</div>
</div>

<div class="card">
<img src="gifs/reaction.gif">
<div class="title">Reaction Meme</div>
</div>

</div>

</body>
</html>
